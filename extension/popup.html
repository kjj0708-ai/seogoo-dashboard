<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>현안이슈 알림</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif;margin:0;width:360px;background:#fff;color:#0f172a}
  .h{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:12px 14px}
  .h .t{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .h .s{font-size:11px;opacity:.85;margin-top:2px}
  .toolbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #e5e7eb;align-items:center;background:#f8fafc}
  .toolbar button{font-size:12px;padding:6px 10px;border:1px solid #d1d5db;background:#fff;border-radius:6px;cursor:pointer;font-weight:500}
  .toolbar button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
  .toolbar button:hover{filter:brightness(0.97)}
  .cnt{margin-left:auto;font-size:11px;color:#64748b}
  .warn{padding:8px 12px;background:#fef2f2;color:#991b1b;font-size:11px;border-bottom:1px solid #fecaca;line-height:1.45}
  .list{max-height:380px;overflow:auto}
  .row{padding:10px 12px;border-bottom:1px solid #f1f5f9;display:flex;flex-direction:column;gap:3px}
  .row.new{background:#fef2f2}
  .row .t{font-size:13px;font-weight:600;line-height:1.35;color:#0f172a}
  .row .m{font-size:11px;color:#64748b}
  .row .b{display:inline-block;background:#ef4444;color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;margin-right:5px;vertical-align:1px;letter-spacing:.02em}
  .row .st{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#e0e7ff;color:#3730a3;margin-left:4px}
  .empty{padding:32px 16px;text-align:center;color:#94a3b8;font-size:12px}
  .footer{padding:8px 12px;font-size:10px;color:#94a3b8;border-top:1px solid #e5e7eb;background:#f8fafc;display:flex;justify-content:space-between}
</style>
</head>
<body>
  <div class="h">
    <div class="t">🏛 서구 도시주택국 현안이슈</div>
    <div class="s">총괄관리자 실시간 알림</div>
  </div>
  <div class="toolbar">
    <button class="primary" id="btnOpen">대시보드 열기</button>
    <button id="btnSeen">모두 확인</button>
    <button id="btnRefresh" title="지금 새로고침">↻</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div id="warn" class="warn" style="display:none"></div>
  <div class="list" id="list"></div>
  <div class="footer">
    <span id="ft">—</span>
    <span id="ft2"></span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
